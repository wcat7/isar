# Android 15 introduced devices with 16 KB memory pages. A shared library whose
# LOAD segments are linked at the old 4 KB max-page-size still loads there, but
# only through a compatibility path, and Google Play requires 16 KB alignment
# from 2027-02-01. Only the 64-bit targets need it: there are no 32-bit 16 KB
# devices.
#
# NDK r28 passes this by default, but the flag is set explicitly so the output
# does not depend on which NDK happens to be on PATH when the binaries are
# rebuilt — the committed .so files outlive the machine that produced them.

[target.aarch64-linux-android]
rustflags = [
    "-C", "link-arg=-Wl,--hash-style=both",
    "-C", "link-arg=-Wl,-z,max-page-size=16384",
]

[target.armv7-linux-androideabi]
rustflags = ["-C", "link-arg=-Wl,--hash-style=both"]

[target.x86_64-linux-android]
rustflags = [
    "-C", "link-arg=-Wl,--hash-style=both",
    "-C", "link-arg=-Wl,-z,max-page-size=16384",
]

[target.i686-linux-android]
rustflags = ["-C", "link-arg=-Wl,--hash-style=both"]
